services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_guardian
      POSTGRES_USER: campus_guardian
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - cg_postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://campus_guardian:change-me-local-only@db:5432/campus_guardian
      SECRET_KEY: replace-me-with-a-long-random-secret
      CORS_ORIGINS: http://localhost:3000
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"

volumes:
  cg_postgres_data:
